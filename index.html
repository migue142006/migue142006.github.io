<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Para la muchacha Naomi♥</title>
  <style>
    /* Reset base y bloqueo de scroll para experiencia a pantalla completa */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    /* Contenedor principal anclado al viewport real (100dvh + sincronización JS visualViewport) */
    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: #09090b;
      overflow: hidden;
    }

    /* Escenario flexible que aloja el canvas ASCII al 100% del espacio disponible */
    .stage {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Barra inferior dedicada para el mensaje en dos líneas y el crédito discreto */
    .message-bar {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
      padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
      font-family: 'Courier New', Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      user-select: none;
      -webkit-user-select: none;
      z-index: 2;
    }

    /* Líneas del mensaje principal centradas sin romperse en pantallas móviles */
    .msg-line {
      display: block;
      white-space: nowrap;
      font-size: clamp(15px, 4.5vw, 24px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.35;
    }

    /* Cada carácter del mensaje principal se anima de forma independiente */
    .msg-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      will-change: opacity, transform, color;
    }

    /* Crédito inferior estilo terminal discreto (inspirado en ANSI 238-243) */
    .credit-line {
      display: block;
      margin-top: 6px;
      white-space: nowrap;
      font-size: clamp(11px, 3.2vw, 14px);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #767676;
      opacity: 0;
      transform: translateY(6px);
      will-change: opacity, transform;
    }
  </style>
</head>
<body>
  <!-- Contenedor principal adaptable a visualViewport en iOS/Android y escritorio -->
  <div class="app" id="app">
    <!-- Escenario del ramo 3D en ASCII -->
    <div class="stage" id="stage">
      <canvas id="canvas" aria-label="Ramo de flores 3D en ASCII"></canvas>
    </div>

    <!-- Barra fija inferior con mensaje principal en 2 líneas y crédito -->
    <div class="message-bar" id="message-bar" aria-label="Con cariño para Naomi, Att: el conejo">
      <div id="message-lines"></div>
      <div class="credit-line" id="credit-line">Att: el conejo</div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // =========================================================================
      // 1. CONSTANTES DEL MOTOR 3D Y PALETAS ANSI ORIGINALES
      // =========================================================================
      const SPIN_SPEED = 0.6;
      const TILT = 0.30;
      const CAM_DIST = 4.0;
      const PIVOT_Y = 0.2;
      const NUM_HEARTS = 18;

      const MESSAGE_LINES = ["Con cariño para", "Naomi♥"];
      const CREDIT_TEXT = "Att: El conejo";

      // Tiempos de animación de introducción (en segundos)
      const REVEAL_DURATION = 3.2;
      const Y_MIN = -0.55;
      const Y_MAX = 0.95;
      const MSG_START_T = 2.95;
      const MSG_END_T = 4.35;
      const CREDIT_START_T = 4.45;
      const CREDIT_END_T = 5.25;

      // Paletas exactas de índices ANSI (xterm 256 colores)
      const WHITE = [244, 248, 251, 254, 255, 231];
      const PINK = [125, 162, 168, 205, 211, 218, 225];
      const RED = [52, 88, 124, 160, 196, 203];
      const PURPLE = [54, 91, 97, 134, 140, 183];
      const YELLOW = [136, 178, 214, 220, 226, 229];
      const ORANGE = [130, 166, 202, 208, 214, 216];
      const GOLD_CENTER = [94, 136, 178, 214, 220];
      const DARK_CENTER = [52, 58, 94, 130, 136];
      const GREENS = [22, 28, 28, 34, 35, 71, 77, 114];
      const PAPER = [101, 144, 187, 223, 230, 231];
      const RIBBON = [88, 125, 161, 197, 204, 211];
      const HEART_COLORS = [161, 197, 204, 205, 211, 218];
      const MSG_COLORS = [161, 168, 205, 211, 218, 225, 218, 211, 205, 168];

      const SHADE = ".:-=+*%@";
      const PETAL_SHADE = "+*#%";

      // Vector de luz direccional normalizado (-0.45, 0.6, 0.66)
      const _L = [-0.45, 0.6, 0.66];
      const _Ln = Math.sqrt(_L[0] * _L[0] + _L[1] * _L[1] + _L[2] * _L[2]);
      const LX = _L[0] / _Ln;
      const LY = _L[1] / _Ln;
      const LZ = _L[2] / _Ln;

      const DISC_TYPES = [
        [WHITE, GOLD_CENTER, 13],
        [PINK, GOLD_CENTER, 8],
        [RED, DARK_CENTER, 6],
        [PURPLE, GOLD_CENTER, 7],
        [YELLOW, DARK_CENTER, 12],
        [ORANGE, DARK_CENTER, 9]
      ];
      const TULIP_COLORS = [RED, PINK, YELLOW];

      // =========================================================================
      // 2. CONVERSOR EXACTO XTERM 256 COLORES ANSI -> RGB
      // =========================================================================
      const ANSI_RGB = new Array(256);
      (function buildAnsiTable() {
        const standard16 = [
          "#000000", "#800000", "#008000", "#808000",
          "#000080", "#800080", "#008080", "#c0c0c0",
          "#808080", "#ff0000", "#00ff00", "#ffff00",
          "#0000ff", "#ff00ff", "#00ffff", "#ffffff"
        ];
        for (let i = 0; i < 16; i++) {
          ANSI_RGB[i] = standard16[i];
        }
        const levels = [0, 95, 135, 175, 215, 255];
        for (let i = 16; i < 232; i++) {
          const idx = i - 16;
          const r = levels[Math.floor(idx / 36)];
          const g = levels[Math.floor((idx % 36) / 6)];
          const b = levels[idx % 6];
          ANSI_RGB[i] = `rgb(${r},${g},${b})`;
        }
        for (let i = 232; i < 256; i++) {
          const v = 8 + (i - 232) * 10;
          ANSI_RGB[i] = `rgb(${v},${v},${v})`;
        }
      })();

      // =========================================================================
      // 3. UTILIDADES MATEMÁTICAS, EASING Y PRNG DETERMINISTA (SEMILLA 21)
      // =========================================================================
      function createSeededRandom(seed) {
        let a = seed >>> 0;
        function next() {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        return {
          random: next,
          uniform: function (min, max) {
            return min + (max - min) * next();
          }
        };
      }

      function clamp(val, min, max) {
        return val < min ? min : (val > max ? max : val);
      }

      function easeOutCubic(x) {
        const inv = 1 - x;
        return 1 - inv * inv * inv;
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function norm(v) {
        const m = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1.0;
        return [v[0] / m, v[1] / m, v[2] / m];
      }

      function cross(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0]
        ];
      }

      function add(p, d, k) {
        return [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];
      }

      // =========================================================================
      // 4. CONSTRUCCIÓN DE LA ESCENA 3D (FIEL AL SCRIPT ORIGINAL EN PYTHON)
      // =========================================================================
      function buildScene() {
        const rnd = createSeededRandom(21);
        const pts = [];
        const neck = [0.0, -0.12, 0.0];

        const C = [0.0, 0.12, 0.0];
        const D = 0.64;
        const N = 10;
        const golden = Math.PI * (3 - Math.sqrt(5));
        const heads = [];

        // 10 cabezas florales en espiral áurea
        for (let i = 0; i < N; i++) {
          const el = (88 - 60 * Math.sqrt(i / (N - 1))) * (Math.PI / 180);
          const az = i * golden;
          const d = [
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az)
          ];
          const pos = add(C, d, D * rnd.uniform(0.92, 1.05));
          heads.push([pos, norm(d)]);
        }

        const tulipSlots = new Set([3, 8]);
        const flowers = [];
        let discI = 0;

        // Tallos principales y asignación de flores (margaritas y tulipanes)
        for (let idx = 0; idx < heads.length; idx++) {
          const pos = heads[idx][0];
          const axis = heads[idx][1];
          const base = add(pos, axis, -0.03);

          for (let j = 0; j < 70; j++) {
            const t = j / 69;
            const px = base[0] + (neck[0] - base[0]) * t;
            const py = base[1] + (neck[1] - base[1]) * t;
            const pz = base[2] + (neck[2] - base[2]) * t;
            pts.push({
              x: px, y: py, z: pz,
              nx: axis[0], ny: 0.0, nz: axis[2],
              pal: GREENS, tone: -0.15, twoSided: true, override: null
            });
          }

          if (tulipSlots.has(idx)) {
            let nT = 0;
            tulipSlots.forEach(function (k) {
              if (k < idx) nT++;
            });
            flowers.push({
              pos: pos,
              kind: "tulip",
              pal: TULIP_COLORS[nT % TULIP_COLORS.length],
              cpal: null,
              nPet: 0,
              R: 0.11,
              seed: rnd.uniform(0, 6.28)
            });
          } else {
            const discDef = DISC_TYPES[discI % DISC_TYPES.length];
            discI++;
            flowers.push({
              pos: pos,
              kind: "disc",
              pal: discDef[0],
              cpal: discDef[1],
              nPet: discDef[2],
              R: rnd.uniform(0.12, 0.14),
              seed: rnd.uniform(0, 6.28)
            });
          }
        }

        // 8 hojas curvadas con nervadura central
        for (let i = 0; i < 8; i++) {
          const a = ((i + 0.4) / 8) * 2 * Math.PI;
          const c = Math.cos(a);
          const s = Math.sin(a);
          const base = [0.26 * c, 0.30, 0.26 * s];
          const d = norm([c, 0.15, s]);
          const side = [-s, 0.0, c];
          const n = norm(cross(side, d));
          const L = 0.30;
          const W = 0.07;

          for (let ti = 0; ti < 32; ti++) {
            const t = ti / 31;
            const sinPiT = Math.sin(Math.PI * t);
            for (let wi = -5; wi <= 5; wi++) {
              const w = wi / 5;
              const curl = 0.025 * w * w;
              const px = base[0] + d[0] * L * t + side[0] * W * sinPiT * w + n[0] * curl;
              const py = base[1] + d[1] * L * t - 0.10 * t * t + n[1] * curl;
              const pz = base[2] + d[2] * L * t + side[2] * W * sinPiT * w + n[2] * curl;
              const rib = wi === 0 ? -0.25 : 0.0;
              pts.push({
                x: px, y: py, z: pz,
                nx: n[0], ny: n[1], nz: n[2],
                pal: GREENS, tone: rib, twoSided: true, override: null
              });
            }
          }
        }

        // Papel envoltorio cónico con borde superior ondulado y pliegues
        const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36;
        const kSlope = (r1 - r0) / (y1 - y0);
        const rings = 50;
        for (let i = 0; i < rings; i++) {
          const t = i / (rings - 1);
          const r = r0 + (r1 - r0) * t;
          const count = Math.max(8, Math.floor(170 * r));
          for (let j = 0; j < count; j++) {
            const ph = ((j + rnd.random()) / count) * 2 * Math.PI;
            const c = Math.cos(ph);
            const s = Math.sin(ph);
            let y = y0 + (y1 - y0) * t;
            if (t > 0.9) {
              y += 0.03 * Math.sin(9 * ph);
            }
            const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
            const nn = norm([c, -kSlope, s]);
            pts.push({
              x: r * c, y: y, z: r * s,
              nx: nn[0], ny: nn[1], nz: nn[2],
              pal: PAPER, tone: fold, twoSided: false, override: null
            });
          }
        }

        // 7 tallos inferiores saliendo por debajo del papel
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * 2 * Math.PI;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          const sx = 0.025 * ca;
          const sz = 0.025 * sa;
          for (let j = 0; j < 40; j++) {
            const t = j / 39;
            pts.push({
              x: sx * (1 + 1.2 * t),
              y: -0.20 - 0.30 * t,
              z: sz * (1 + 1.2 * t),
              nx: ca, ny: 0.0, nz: sa,
              pal: GREENS, tone: -0.1, twoSided: true, override: null
            });
          }
        }

        // Cinta roja alrededor del cuello del ramo
        const by = -0.12;
        const br = r0 + kSlope * (by - y0) + 0.01;
        for (let j = 0; j < 90; j++) {
          const ph = (j / 90) * 2 * Math.PI;
          const c = Math.cos(ph);
          const s = Math.sin(ph);
          const dys = [-0.012, 0.0, 0.012];
          for (let di = 0; di < dys.length; di++) {
            pts.push({
              x: br * c, y: by + dys[di], z: br * s,
              nx: c, ny: 0.0, nz: s,
              pal: RIBBON, tone: 0.0, twoSided: false, override: null
            });
          }
        }

        // Moño (lazos, caídas y nudo central)
        const knot = [0.0, by, br + 0.01];
        const sides = [-1, 1];
        for (let si = 0; si < sides.length; si++) {
          const side = sides[si];
          for (let j = 0; j < 70; j++) {
            const a = (j / 70) * 2 * Math.PI;
            const lx = side * (0.07 + 0.07 * Math.cos(a));
            const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
            const fills = [1.0, 0.7];
            for (let fi = 0; fi < fills.length; fi++) {
              const fill = fills[fi];
              pts.push({
                x: knot[0] + lx * fill,
                y: knot[1] + ly * fill,
                z: knot[2] + 0.01,
                nx: side * 0.3, ny: 0.2, nz: 0.93,
                pal: RIBBON, tone: 0.1, twoSided: true, override: null
              });
            }
          }
          for (let j = 0; j < 30; j++) {
            const t = j / 29;
            pts.push({
              x: knot[0] + side * 0.06 * t,
              y: knot[1] - 0.15 * t,
              z: knot[2] + 0.015,
              nx: side * 0.2, ny: 0.0, nz: 0.98,
              pal: RIBBON,
              tone: -0.05 + 0.05 * Math.sin(t * 9),
              twoSided: true,
              override: null
            });
          }
        }

        const knotDxs = [-0.01, 0.0, 0.01];
        for (let ki = 0; ki < knotDxs.length; ki++) {
          pts.push({
            x: knotDxs[ki], y: by, z: knot[2] + 0.02,
            nx: 0, ny: 0, nz: 1,
            pal: RIBBON, tone: 0.2, twoSided: true, override: "@"
          });
        }

        // 90 florecitas blancas (baby's breath)
        const babies = [];
        for (let i = 0; i < 90; i++) {
          const a = rnd.random() * 2 * Math.PI;
          const el = rnd.uniform(0.3, 1.4);
          const rr = rnd.uniform(0.40, 0.58);
          babies.push({
            x: rr * Math.cos(a) * Math.cos(el),
            y: C[1] + rr * Math.sin(el),
            z: rr * Math.sin(a) * Math.cos(el),
            phase: rnd.uniform(0, 6.28)
          });
        }

        // 30 destellos brillantes (sparkles)
        const sparkles = [];
        for (let i = 0; i < 30; i++) {
          const a = rnd.random() * 2 * Math.PI;
          const rr = rnd.uniform(0.75, 0.95);
          sparkles.push({
            x: rr * Math.cos(a),
            y: rnd.uniform(-0.3, 1.0),
            z: rr * Math.sin(a),
            phase: rnd.uniform(0, 6.28),
            speed: rnd.uniform(1.5, 4.0)
          });
        }

        return { pts, flowers, babies, sparkles };
      }

      // =========================================================================
      // 5. CORAZONES FLOTANTES DE FONDO
      // =========================================================================
      function randomHeartColor() {
        return HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
      }

      function updateHearts(hearts, dt) {
        while (hearts.length < NUM_HEARTS) {
          hearts.push({
            x: Math.random(),
            y: 1.0 + Math.random(),
            speed: 0.03 + Math.random() * 0.05,
            phase: Math.random() * 6.28,
            color: randomHeartColor()
          });
        }
        for (let i = 0; i < hearts.length; i++) {
          const h = hearts[i];
          h.y -= h.speed * dt;
          if (h.y < 0) {
            h.x = Math.random();
            h.y = 1.0;
            h.color = randomHeartColor();
          }
        }
      }

      // =========================================================================
      // 6. CONFIGURACIÓN DEL DOM, CANVAS DE ALTA DENSIDAD Y MENSAJE INFERIOR
      // =========================================================================
      const appEl = document.getElementById("app");
      const stageEl = document.getElementById("stage");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const messageLinesEl = document.getElementById("message-lines");
      const creditLineEl = document.getElementById("credit-line");

      const FONT_STACK = "'Courier New', Courier, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";

      // Construir las 2 líneas del mensaje con un <span> por carácter
      const msgSpans = [];
      (function initMessageBar() {
        const frag = document.createDocumentFragment();
        for (let l = 0; l < MESSAGE_LINES.length; l++) {
          const lineEl = document.createElement("div");
          lineEl.className = "msg-line";
          const lineText = MESSAGE_LINES[l];
          for (let i = 0; i < lineText.length; i++) {
            const span = document.createElement("span");
            span.className = "msg-char";
            span.textContent = lineText[i] === " " ? "\u00A0" : lineText[i];
            lineEl.appendChild(span);
            msgSpans.push(span);
          }
          frag.appendChild(lineEl);
        }
        messageLinesEl.appendChild(frag);
        creditLineEl.textContent = CREDIT_TEXT;
      })();

      let stageW = 300;
      let stageH = 300;
      let cols = 60;
      let rows = 30;
      let cellW = 6;
      let cellH = 12;
      let offsetX = 0;
      let offsetY = 0;

      // Buffers reutilizables por frame para evitar pausas de GC
      let chars = [];
      let colors = new Int16Array(0);
      let zbuf = new Float32Array(0);

      function syncViewportAndResize() {
        // Sincronizar altura exacta con visualViewport en iOS Safari / Android Chrome
        if (window.visualViewport) {
          appEl.style.height = `${Math.floor(window.visualViewport.height)}px`;
        } else {
          appEl.style.height = "";
        }

        const rect = stageEl.getBoundingClientRect();
        stageW = Math.max(1, Math.floor(rect.width));
        stageH = Math.max(1, Math.floor(rect.height));

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(stageW * dpr);
        canvas.height = Math.floor(stageH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Tamaño de fuente dinámico entre 8px y 14px para buena nitidez en móvil y PC
        const targetFont = Math.min(stageW / 44, stageH / 34);
        const fontSize = clamp(targetFont, 8, 14);

        ctx.font = `${fontSize}px ${FONT_STACK}`;
        ctx.textBaseline = "top";

        const measured = ctx.measureText("M").width;
        cellW = Math.max(4.5, measured);
        // Relación 2:1 clásica de terminal (empareja sxScale = scale * 2.0)
        cellH = cellW * 2.0;

        cols = Math.max(20, Math.floor(stageW / cellW));
        rows = Math.max(12, Math.floor(stageH / cellH));

        offsetX = (stageW - cols * cellW) * 0.5;
        offsetY = (stageH - rows * cellH) * 0.5;

        const total = cols * rows;
        chars = new Array(total);
        colors = new Int16Array(total);
        zbuf = new Float32Array(total);
      }

      // =========================================================================
      // 7. ANIMACIÓN DEL MENSAJE PRINCIPAL Y DEL CRÉDITO INFERIOR
      // =========================================================================
      function updateMessageBar(t) {
        const shift = Math.floor(t * 6);
        const len = msgSpans.length;
        const totalWindow = MSG_END_T - MSG_START_T;
        const charWindow = totalWindow * 0.45;
        const stagger = len > 1 ? (totalWindow - charWindow) / (len - 1) : 0;

        for (let i = 0; i < len; i++) {
          const span = msgSpans[i];
          const ansiIdx = MSG_COLORS[(i + shift) % MSG_COLORS.length];
          span.style.color = ANSI_RGB[ansiIdx];

          if (t < MSG_START_T) {
            span.style.opacity = "0";
            span.style.transform = "translateY(10px)";
          } else {
            const localT = (t - (MSG_START_T + i * stagger)) / charWindow;
            const p = clamp(localT, 0, 1);
            const eased = easeOutCubic(p);
            span.style.opacity = eased.toFixed(3);
            span.style.transform = `translateY(${((1 - eased) * 10).toFixed(2)}px)`;
          }
        }

        // Aparición suave del crédito "Att: el conejo" justo tras revelar el mensaje principal
        if (t < CREDIT_START_T) {
          creditLineEl.style.opacity = "0";
          creditLineEl.style.transform = "translateY(6px)";
        } else {
          const cp = clamp((t - CREDIT_START_T) / (CREDIT_END_T - CREDIT_START_T), 0, 1);
          const ce = easeOutCubic(cp);
          creditLineEl.style.opacity = ce.toFixed(3);
          creditLineEl.style.transform = `translateY(${((1 - ce) * 6).toFixed(2)}px)`;
        }
      }

      // =========================================================================
      // 8. RENDERIZADO DE FRAME 3D ASCII + CRECIMIENTO DE ABAJO HACIA ARRIBA
      // =========================================================================
      function renderFrame(scene, t, hearts) {
        const { pts, flowers, babies, sparkles } = scene;
        const total = cols * rows;

        for (let i = 0; i < total; i++) {
          chars[i] = " ";
          colors[i] = 0;
          zbuf[i] = -1e9;
        }

        // Proyección y centrado dentro de .stage
        const scale = Math.max(1.0, Math.min((rows - 2) / 1.55, (cols - 2) / 2.65));
        const sxScale = scale * 2.0;
        const cx = cols * 0.5;
        const cy = rows * 0.54;

        // Onda ascendente de revelación (de abajo hacia arriba)
        const revealProgress = easeOutCubic(Math.min(1, t / REVEAL_DURATION));
        const yCutoff = Y_MIN + (Y_MAX - Y_MIN) * revealProgress;
        const isRevealing = t < REVEAL_DURATION;

        const ang = t * SPIN_SPEED;
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        const ct = Math.cos(TILT);
        const st = Math.sin(TILT);

        function plot(col, row, z, ch, color) {
          if (row >= 0 && row < rows && col >= 0 && col < cols) {
            const idx = row * cols + col;
            if (z > zbuf[idx]) {
              zbuf[idx] = z;
              chars[idx] = ch;
              colors[idx] = color;
            }
          }
        }

        // 1. Corazones flotantes de fondo
        for (let i = 0; i < hearts.length; i++) {
          const h = hearts[i];
          const rawCol = Math.trunc((h.x + 0.015 * Math.sin(t * 1.2 + h.phase)) * cols);
          const col = ((rawCol % cols) + cols) % cols;
          const row = Math.trunc(h.y * rows);
          plot(col, row, -50, "♥", h.color);
        }

        // 2. Nube de puntos 3D (tallos, hojas, papel, lazo, moño)
        const shadeLen = SHADE.length;
        const petalShadeLen = PETAL_SHADE.length;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (p.y > yCutoff) continue;

          const xr = p.x * ca - p.z * sa;
          const zr = p.x * sa + p.z * ca;
          const yp = p.y - PIVOT_Y;
          const yt = yp * ct - zr * st;
          const zt = yp * st + zr * ct;
          const f = CAM_DIST / (CAM_DIST - zt);

          const col = Math.trunc(cx + xr * f * sxScale);
          const row = Math.trunc(cy - yt * f * scale);

          const nxr = p.nx * ca - p.nz * sa;
          const nzr = p.nx * sa + p.nz * ca;
          const nyt = p.ny * ct - nzr * st;
          const nzt = p.ny * st + nzr * ct;

          let dot = nxr * LX + nyt * LY + nzt * LZ;
          if (p.twoSided && dot < 0) {
            dot = -dot * 0.55;
          }

          let b = 0.25 + 0.75 * Math.max(0.0, dot) + p.tone;

          // Brillo/destello sutil en el borde superior ascendente de crecimiento
          if (isRevealing && (yCutoff - p.y) < 0.055) {
            b += 0.35;
          }

          b = clamp(b, 0.0, 0.999);

          let ch;
          if (p.override === "P") {
            ch = PETAL_SHADE[Math.floor(b * petalShadeLen)];
          } else if (p.override !== null) {
            ch = p.override;
          } else {
            ch = SHADE[Math.floor(b * shadeLen)];
          }

          plot(col, row, zt, ch, p.pal[Math.floor(b * p.pal.length)]);
        }

        // 3. Flores procedurales (margaritas y tulipanes) con brote easeOutBack
        for (let i = 0; i < flowers.length; i++) {
          const fl = flowers[i];
          const x = fl.pos[0];
          const y = fl.pos[1];
          const z = fl.pos[2];

          const rawBloom = clamp((yCutoff - (y - 0.06)) / 0.22, 0, 1);
          if (rawBloom <= 0.001) continue;

          const bloomScale = Math.max(0.05, easeOutBack(rawBloom));
          const currentR = fl.R * bloomScale;

          const xr = x * ca - z * sa;
          const zr = x * sa + z * ca;
          const yp = y - PIVOT_Y;
          const yt = yp * ct - zr * st;
          const zt = yp * st + zr * ct;
          const f = CAM_DIST / (CAM_DIST - zt);

          const fx = cx + xr * f * sxScale;
          const fy = cy - yt * f * scale;
          const rx = currentR * f * sxScale;
          const ry = currentR * f * scale;

          if (rx < 0.1 || ry < 0.1) continue;

          const dim = -0.4 * (1 - clamp((zt + 0.6) / 1.2, 0.0, 1.0));
          const rot = fl.seed + ang * 0.7;

          const rowStart = Math.trunc(fy - ry) - 1;
          const rowEnd = Math.trunc(fy + ry) + 1;
          const colStart = Math.trunc(fx - rx) - 1;
          const colEnd = Math.trunc(fx + rx) + 1;

          for (let row = rowStart; row <= rowEnd; row++) {
            const dy = (row + 0.5 - fy) / ry;
            for (let col = colStart; col <= colEnd; col++) {
              const dx = (col + 0.5 - fx) / rx;

              if (fl.kind === "disc") {
                const s = Math.sqrt(dx * dx + dy * dy);
                if (s > 1.0) continue;

                if (s < 0.3) {
                  const b = clamp(0.55 - 0.35 * dx - 0.35 * dy + dim, 0.0, 0.999);
                  plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", fl.cpal[Math.floor(b * fl.cpal.length)]);
                  continue;
                }

                const ph = Math.atan2(dy, dx);
                const reach = 0.32 + 0.68 * Math.pow(Math.abs(Math.cos(fl.nPet * (ph + rot) * 0.5)), 0.7);
                if (s > reach) continue;

                const edge = s > reach - 0.14 ? -0.22 : 0.0;
                const b = clamp(0.62 - 0.22 * dx - 0.28 * dy + 0.12 * s + edge + dim, 0.0, 0.999);
                plot(
                  col, row, zt + 0.04 * (1 - s),
                  PETAL_SHADE[Math.floor(b * petalShadeLen)],
                  fl.pal[Math.floor(b * fl.pal.length)]
                );
              } else {
                const v = (1 - dy) * 0.5;
                if (v < 0 || v > 1) continue;

                const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1.0, v * 1.5 + 0.05));
                if (hw <= 0 || Math.abs(dx) > hw) continue;

                const xn = dx / hw;
                const cosTop = Math.cos(1.5 * Math.PI * xn);
                if (v > 0.72 + 0.28 * cosTop * cosTop) continue;

                const seam = (Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3) ? -0.25 : 0.0;
                const b = clamp(0.55 - 0.3 * xn + 0.1 * v + seam + dim, 0.0, 0.999);
                plot(
                  col, row, zt + 0.03,
                  PETAL_SHADE[Math.floor(b * petalShadeLen)],
                  fl.pal[Math.floor(b * fl.pal.length)]
                );
              }
            }
          }
        }

        // 4. Florecitas blancas (baby's breath)
        for (let i = 0; i < babies.length; i++) {
          const b = babies[i];
          if (b.y > yCutoff) continue;

          const xr = b.x * ca - b.z * sa;
          const zr = b.x * sa + b.z * ca;
          const yp = b.y - PIVOT_Y;
          const yt = yp * ct - zr * st;
          const zt = yp * st + zr * ct;
          const f = CAM_DIST / (CAM_DIST - zt);

          const col = Math.trunc(cx + xr * f * sxScale);
          const row = Math.trunc(cy - yt * f * scale);
          const star = Math.sin(t * 2 + b.phase) > 0.6;
          plot(col, row, zt + 0.02, star ? "*" : "·", star ? 231 : 255);
        }

        // 5. Destellos brillantes (sparkles)
        for (let i = 0; i < sparkles.length; i++) {
          const sp = sparkles[i];
          if (sp.y > yCutoff) continue;

          const xr = sp.x * ca - sp.z * sa;
          const zr = sp.x * sa + sp.z * ca;
          const yp = sp.y - PIVOT_Y;
          const yt = yp * ct - zr * st;
          const zt = yp * st + zr * ct;
          const f = CAM_DIST / (CAM_DIST - zt);

          const col = Math.trunc(cx + xr * f * sxScale);
          const row = Math.trunc(cy - yt * f * scale);
          const tw = Math.sin(t * sp.speed + sp.phase);

          if (tw > 0.85) {
            plot(col, row, zt, "*", 231);
          } else if (tw > 0.4) {
            plot(col, row, zt, "+", 225);
          } else if (tw > 0.0) {
            plot(col, row, zt, "·", 218);
          }
        }

        // 6. Dibujo de la grilla ASCII en el Canvas
        ctx.fillStyle = "#09090b";
        ctx.fillRect(0, 0, stageW, stageH);

        let lastColor = -1;
        for (let r = 0; r < rows; r++) {
          const rowOffset = r * cols;
          const py = offsetY + r * cellH;
          for (let c = 0; c < cols; c++) {
            const idx = rowOffset + c;
            const ch = chars[idx];
            if (ch === " ") continue;

            const colCode = colors[idx];
            if (colCode !== lastColor) {
              lastColor = colCode;
              ctx.fillStyle = ANSI_RGB[colCode] || "#ffffff";
            }
            ctx.fillText(ch, offsetX + c * cellW, py);
          }
        }
      }

      // =========================================================================
      // 9. INICIALIZACIÓN Y BUCLE DE ANIMACIÓN
      // =========================================================================
      window.onload = function () {
        try {
          const scene = buildScene();
          const hearts = [];

          syncViewportAndResize();
          window.addEventListener("resize", syncViewportAndResize, { passive: true });
          window.addEventListener("orientationchange", syncViewportAndResize, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", syncViewportAndResize, { passive: true });
          }

          const startTime = performance.now();
          let lastTime = startTime;

          function animate(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            const elapsed = (now - startTime) / 1000;

            updateHearts(hearts, dt);
            renderFrame(scene, elapsed, hearts);
            updateMessageBar(elapsed);

            requestAnimationFrame(animate);
          }

          requestAnimationFrame(animate);
        } catch (err) {
          console.error("Error al iniciar la animación del ramo ASCII:", err);
        }
      };
    })();
  </script>
</body>
</html>
